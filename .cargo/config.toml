[build]
target = "x86_64-unknown-none"
rustflags = [
    "-C", "link-arg=-Tkernel/linker.ld",
    "-C", "link-arg=-no-pie",
    "-C", "target-feature=-sse,-sse2,-avx,-avx2",
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
]

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tkernel/linker.ld",
    "-C", "link-arg=-no-pie",
    "-C", "target-feature=-sse,-sse2,-avx,-avx2",
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
]
