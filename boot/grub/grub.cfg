set timeout=0
set default=0

insmod all_video
insmod video_bochs
insmod video_cirrus
insmod vbe
insmod vga
insmod gfxterm

set gfxmode=1024x768x32
terminal_output gfxterm

# Keep the graphics mode set up by GRUB across the handoff.
set gfxpayload=keep

menuentry "AtrodraX Rust v0.1" {
    multiboot2 /boot/kernel.bin
    boot
}
